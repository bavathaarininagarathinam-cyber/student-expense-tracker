<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">

    <!-- 1. Header Section -->
    <header class="header">
      <h1>🎓 Student Expense Tracker</h1>
      <p class="subtitle">Track your daily college spending in Rupees (₹)</p>
    </header>

    <!-- 2. Total Spent Summary Section -->
    <section class="total-section">
      <div class="total-card">
        <h2>Total Spent</h2>
        <p class="total-amount" id="total-amount">₹0.00</p>
      </div>
    </section>

    <!-- 3. Category Spending Breakdown Section -->
    <section class="breakdown-section">
      <h2>Category Breakdown</h2>
      <div class="category-breakdown-grid" id="category-breakdown-grid">
        <!-- Rendered dynamically by script.js -->
      </div>
    </section>

    <!-- 4. Expense Input Form Section -->
    <section class="form-section">
      <h2>Add New Expense</h2>
      <form id="expense-form">

        <div class="form-group">
          <label for="expense-name">Expense Name</label>
          <input 
            type="text" 
            id="expense-name" 
            placeholder="e.g. Canteen Lunch, Bus Pass, Lab Manual" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="expense-amount">Amount (in ₹)</label>
          <input 
            type="number" 
            id="expense-amount" 
            placeholder="e.g. 150" 
            step="0.01" 
            min="0.01" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="expense-category">Category</label>
          <select id="expense-category" required>
            <option value="" disabled selected>Select a category</option>
            <option value="Food">🍔 Food</option>
            <option value="Travel">🚌 Travel</option>
            <option value="Books">📚 Books</option>
            <option value="Fun">🎉 Fun</option>
            <option value="Other">🏷️ Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="expense-date">Date</label>
          <input 
            type="date" 
            id="expense-date" 
            required 
          />
        </div>

        <button type="submit" id="add-expense-btn">Add Expense</button>
      </form>
    </section>

    <!-- 5. Expense History & Filter Section -->
    <section class="list-section">
      <div class="list-header">
        <h2>Expense History</h2>
        <!-- Filter dropdown to view one category at a time -->
        <div class="filter-wrapper">
          <label for="filter-category">Filter:</label>
          <select id="filter-category">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Books">Books</option>
            <option value="Fun">Fun</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      
      <ul id="expense-list" class="expense-list"></ul>
      <p id="empty-state" class="empty-state">No expenses found. Enter your first spend above!</p>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
